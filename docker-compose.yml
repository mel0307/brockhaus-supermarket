version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5430:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: brockhaus
    networks:
      - brockhaus

volumes:
  postgres-data:

networks:
  brockhaus:
    name: postgres-supermarket
    driver: bridge
    external: false