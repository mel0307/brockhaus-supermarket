spring:
  application:
    name: brockhaus-supermarket

  flyway:
    enabled: true
    schemas: supermarket
    default-schema: supermarket
    create-schemas: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties.org.hibernate.envers:
      audit_table_suffix: _history
      store_data_at_delete: true

  datasource:
    url: jdbc:postgresql://localhost:5430/brockhaus
    username: postgres
    password: password